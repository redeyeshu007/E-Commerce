name: CI Pipeline & Test Gating

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck, Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Verify workspace dependencies & secrets
        run: |
          node scripts/check-circular-deps.js
          node scripts/check-env.js

      - name: Verify code formatting (Prettier)
        run: npm run format:check

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run unit & component test suites
        run: npm run test

      - name: Install Playwright Chromium browser & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E browser test suite
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright Test Report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14

      - name: Build production bundles
        run: npm run build
