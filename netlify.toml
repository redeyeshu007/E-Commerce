# ==============================================================================
# PERALAGAE Jewellery — Full-Stack Netlify Configuration
# Next.js 16 Storefront + Express.js Serverless API (Monorepo)
# ==============================================================================

[build]
  # Build from repository root so npm workspace packages are resolved
  base = ""
  command = "npm run build:netlify"
  publish = "apps/frontend/.next"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_FLAGS = "--include=dev --legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "apps/backend/prisma/schema.prisma",
    "apps/backend/data/hero-settings.json",
    "apps/backend/data/hero-history.json"
  ]
  external_node_modules = ["@prisma/client", ".prisma"]

# ── API Routing ───────────────────────────────────────────────────────────────
# Routes all /api/* requests directly into our serverless Express API function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ── Uploads Routing ───────────────────────────────────────────────────────────
# Serves uploaded media files through the serverless function
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true
